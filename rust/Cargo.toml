[package]
name = "transit_engine"
version = "0.1.0"
edition = "2021"
description = "Native Rust GTFS-RT & Static SQLite R-Tree engine for Hungary Public Transport Tracker (MÁV + BKK)"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1.0"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
thiserror = "1.0"
tracing = "0.1"
